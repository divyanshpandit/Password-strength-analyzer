<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Strength Analyzer WASM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
  font-family: "Inter", system-ui, sans-serif;
}

/* ===== BACKGROUND ===== */
body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #1a1f3c, #05070f 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

/* ===== GLASS CARD ===== */
.card {
  width: 420px;
  padding: 32px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== HEADER ===== */
.card h1 {
  margin: 0 0 10px;
  text-align: center;
  font-size: 1.6rem;
  letter-spacing: 0.5px;
}

.card p.subtitle {
  text-align: center;
  color: #b8c0ff;
  font-size: 0.9rem;
  margin-bottom: 25px;
}

/* ===== INPUT ===== */
input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 1rem;
  background: rgba(255,255,255,0.15);
  color: white;
  margin-bottom: 18px;
}

input::placeholder {
  color: #ccc;
}

/* ===== BUTTON ===== */
button {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: linear-gradient(135deg, #5f7cff, #8f6bff);
  color: white;
  font-size: 1rem;
  font-weight: 600;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(143,107,255,0.4);
}

/* ===== RESULT ===== */
.result {
  margin-top: 22px;
  padding: 16px;
  border-radius: 12px;
  background: rgba(0,0,0,0.35);
  display: none;
}

.result span {
  display: block;
  margin: 6px 0;
  font-size: 0.95rem;
}

/* ===== STRENGTH COLORS ===== */
.weak { color: #ff6b6b; }
.moderate { color: #ffd166; }
.strong { color: #6bffb3; }
.very-strong { color: #6bd4ff; }

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 0.75rem;
  color: #aaa;
}
</style>
</head>

<body>

<div class="card">
  <h1>Password Analyzer</h1>
  <p class="subtitle">Powered by C + WebAssembly</p>

  <input type="password" id="pwd" placeholder="Enter your password">
  <button onclick="analyze()">Analyze Strength</button>

  <div id="result" class="result"></div>

  <div class="footer">
    Client-side • No data leaves your browser
  </div>
</div>

<script src="password.js"></script>
<script>
function analyze() {
  const pwd = document.getElementById("pwd").value;
  const resultDiv = document.getElementById("result");

  if (!pwd) {
    resultDiv.style.display = "block";
    resultDiv.innerHTML = "<span class='weak'>Please enter a password</span>";
    return;
  }

  const entropy = Module.ccall(
    'password_entropy',
    'number',
    ['string'],
    [pwd]
  );

  const time = Module.ccall(
    'brute_force_time',
    'number',
    ['number'],
    [entropy]
  );

  let strengthClass, strengthText;
  if (entropy < 40) {
    strengthClass = "weak";
    strengthText = "Weak";
  } else if (entropy < 60) {
    strengthClass = "moderate";
    strengthText = "Moderate";
  } else if (entropy < 80) {
    strengthClass = "strong";
    strengthText = "Strong";
  } else {
    strengthClass = "very-strong";
    strengthText = "Very Strong";
  }

  resultDiv.style.display = "block";
  resultDiv.innerHTML = `
    <span>Entropy: <b>${entropy.toFixed(2)} bits</b></span>
    <span>Brute-force time: <b>${time.toExponential(2)} seconds</b></span>
    <span class="${strengthClass}">Strength: <b>${strengthText}</b></span>
  `;
}
</script>

</body>
</html>
